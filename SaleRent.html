<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Property Upload - CK Adiithya Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background-color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen p-4 text-slate-800">

  <div class="max-w-xl mx-auto bg-white shadow rounded-xl p-5 border border-slate-200">

    <h2 class="text-xl font-semibold mb-4 text-center">
      Upload Property Details (Simple Version)
    </h2>

    <form id="propertyForm" class="space-y-4">

      <!-- Villa / Plot Number -->
      <div>
        <label class="block text-sm font-medium mb-1">Villa Number / Plot Number</label>
        <input 
          id="unitNumber" 
          type="text" 
          required
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500"
          placeholder="e.g., Villa 23 / Plot 145"
        />
      </div>

      <!-- Photo Upload -->
      <div>
        <label class="block text-sm font-medium mb-1">Upload Photo</label>
        <input 
          id="photo" 
          type="file" 
          accept="image/*" 
          class="block w-full text-sm text-slate-700 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100"
        />
      </div>

      <!-- Video Upload -->
      <div>
        <label class="block text-sm font-medium mb-1">Upload Video</label>
        <input 
          id="video" 
          type="file" 
          accept="video/*" 
          class="block w-full text-sm text-slate-700 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"
        />
      </div>

      <!-- Preview -->
      <div>
        <h3 class="text-sm font-semibold mb-2">Preview</h3>

        <div id="previewPhoto" class="mb-3"></div>
        <div id="previewVideo"></div>
      </div>

      <!-- Submit -->
      <button 
        type="submit" 
        class="w-full bg-sky-600 text-white text-sm font-semibold py-2 rounded-md hover:bg-sky-700"
      >
        Submit (Demo Only)
      </button>

      <p class="text-[11px] text-slate-500 mt-2">
        Note: To store submissions, backend/Google Sheet integration is required.
      </p>
    </form>
  </div>

  <!-- Preview Script -->
  <script>
    const photoInput = document.getElementById("photo");
    const videoInput = document.getElementById("video");
    const previewPhoto = document.getElementById("previewPhoto");
    const previewVideo = document.getElementById("previewVideo");
    const form = document.getElementById("propertyForm");

    photoInput.addEventListener("change", function () {
      previewPhoto.innerHTML = "";
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.className = "w-40 h-40 object-cover rounded-md border border-slate-300";
          previewPhoto.appendChild(img);
        };
        reader.readAsDataURL(file);
      }
    });

    videoInput.addEventListener("change", function () {
      previewVideo.innerHTML = "";
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const video = document.createElement("video");
          video.src = e.target.result;
          video.controls = true;
          video.className = "w-48 h-32 rounded-md border border-slate-300";
          previewVideo.appendChild(video);
        };
        reader.readAsDataURL(file);
      }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Demo only — backend required to save property.");
      form.reset();
      previewPhoto.innerHTML = "";
      previewVideo.innerHTML = "";
    });
  </script>

</body>
</html>
